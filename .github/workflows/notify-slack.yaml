name: Notify Slack (Reusable)

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PR workflow to complete and get result
        id: get_conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "Fetching workflow runs for this commit..."

          for i in {1..10}; do
          result=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$SHA")

          echo "$result" | jq '.workflow_runs[] | {name, conclusion, id, status, head_branch}'

          conclusion=$(echo "$result" | jq -r '.workflow_runs[] | select(.name == "Pull Request") | .conclusion' | head -n 1)

          if [[ "$conclusion" != "null" && "$conclusion" != "" ]]; then
            echo "Found conclusion: $conclusion"
            echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Workflow not complete yet... retrying ($i/10)"
            sleep 6
            fi
            done

          echo "Failed to retrieve workflow conclusion"
          echo "conclusion=unknown" >> "$GITHUB_OUTPUT"

      - name: Send Slack message
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Cypress Test Results: ${{ github.repository }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* ${{ steps.get_conclusion.outputs.conclusion == 'success' && '✅ Passed' || '❌ Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Details:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View on GitHub Actions>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
