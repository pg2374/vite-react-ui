name: Test and Deploy Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  deploy-to-qa:
    name: Deploy to QA Environment
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          
      - name: Deploy to QA (Merge to QA branch)
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git fetch origin qa
          git checkout qa
          git reset --hard origin/qa
          # Use the develop branch version for any conflicts
          git merge -X theirs origin/develop --allow-unrelated-histories || true
          # If merge had conflicts, just overwrite with develop content
          if [ $? -ne 0 ]; then
            git checkout --theirs .
            git add .
            git commit -m "Merge develop into qa (with conflict resolution)"
          fi
          git remote set-url origin https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}
          git push origin qa
      
      # Wait for Amplify deployment to complete
      - name: Wait for QA deployment
        run: sleep 120 # Wait 2 minutes for Amplify deployment

  run-cypress-tests:
    name: Run Cypress Tests on QA
    needs: deploy-to-qa
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.set_result.outputs.result }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Run Cypress tests against QA environment
      - name: Run Cypress Tests
        id: cypress
        uses: cypress-io/github-action@v5
        with:
          config: baseUrl=https://qa.dofuwl7rbpbt1.amplifyapp.com
        continue-on-error: true
      
      # Store test results for next job
      - name: Set test result output
        id: set_result
        run: |
          if [ "${{ steps.cypress.outcome }}" == "success" ]; then
            echo "result=✅ Passed" >> $GITHUB_OUTPUT
          else
            echo "result=❌ Failed" >> $GITHUB_OUTPUT
          fi

  notify-slack:
    name: Notify Slack
    needs: run-cypress-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "*Deployment & Test Results*\n• Repository: ${{ github.repository }}\n• Environment: QA\n• Commit: ${{ github.sha }}\n• Cypress Tests: ${{ needs.run-cypress-tests.outputs.test_result }}\n• GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n• QA App: https://qa.dofuwl7rbpbt1.amplifyapp.com"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK